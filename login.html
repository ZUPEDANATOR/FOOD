<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Eats</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
            background-image: url('Mphos corner.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        header {
            background-color: rgba(255, 107, 107, 0.9); 
            color: white;
            padding: 20px 0;
            text-align: center;
            position: relative;
        }

        .header-image {
            width: 100px; 
            height: 100px;
            margin: 0 auto 15px;
            display: block;
            border-radius: 50%; 
            border: 3px solid white; 
            object-fit: cover;
            background-color: white;
        }
        .logo {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        nav {
            background-color: rgba(51, 51, 51, 0.9); 
            padding: 15px 0;
            position: relative;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        nav li {
            margin: 0 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #ff6b6b;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            padding: 40px 20px;
        }
        .login-form {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            backdrop-filter: blur(3px);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #ff6b6b;
            outline: none;
        }
        .btn {
            background-color: #ff6b6b;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #e05555;
        }
        .forgot-password {
            text-align: right;
            margin-top: 5px;
        }
        .forgot-password a {
            color: #ff6b6b;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        footer {
            background-color: rgba(51, 51, 51, 0.9); 
            color: white;
            text-align: center;
            padding: 20px 0;
            position: relative;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            nav ul {
                flex-direction: column;
                align-items: center;
            }
            nav li {
                margin: 5px 0;
            }
            .login-form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="main logo.jpg" alt="Campus Eats Logo" class="header-image">
        <div class="logo">CAMPUS-EATS</div>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>
    
    <div class="login-container">
        <div class="login-form">
            <h2>Login to Your Account</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <div class="forgot-password">
                        <a href="#">Forgot password?</a>
                    </div>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2023 Campus Eats. All rights reserved.</p>
        <p>By Lebogang Malatjie</p>
    </footer>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            alert('Login successful!');
            window.location.href = 'menu.html';
        });
    </script>
</body>
</html>
